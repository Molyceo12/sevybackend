version: '3.8'

services:
  web:
    build: .
    command: gunicorn sevy.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - /app/venv/ # Ignore virtual environment
    ports:
      - "8080:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery:
    build: .
    command: celery -A sevy worker -l info
    volumes:
      - .:/app
      - /app/venv/
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  redis:
    image: redis:7-alpine

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5433:5432"

volumes:
  postgres_data:
